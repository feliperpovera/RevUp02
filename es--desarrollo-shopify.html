    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Cuánto cuesta crear una tienda en Shopify?","acceptedAnswer":{"@type":"Answer","text":"Depende del alcance: cuántos productos y páginas tienes, si basta con personalizar un tema o necesitas desarrollo a la medida, y si vamos a migrar un sitio que ya existe. Cotizamos cada proyecto de Shopify después de una llamada gratis, para que sepas el costo antes de empezar. Tu suscripción de Shopify y las apps o temas de pago te los cobran directamente Shopify y los desarrolladores de esas apps."}},{"@type":"Question","name":"¿Cuánto cuesta Shopify al mes?","acceptedAnswer":{"@type":"Answer","text":"Shopify cobra una suscripción mensual según el plan que elijas, más las comisiones por procesar pagos y las apps de pago que agregues. Eso se le paga directamente a Shopify y a los desarrolladores de las apps, no a nosotros. Si quieres que nuestro equipo siga manteniendo y mejorando tu tienda después del lanzamiento, la administración continua es un servicio opcional que definimos contigo."}},{"@type":"Question","name":"¿Qué hace una agencia Shopify?","acceptedAnswer":{"@type":"Answer","text":"Planea, diseña, construye y mejora tiendas en Shopify. Con RevUp eso incluye el diseño y la configuración de la tienda, la personalización del tema, funciones a la medida e integración de apps, migraciones, SEO técnico, medición y optimización continua, y si lo quieres, anuncios en Google, Meta y TikTok para traer compradores a tu tienda."}},{"@type":"Question","name":"¿Me conviene contratar un experto en Shopify freelance o una agencia?","acceptedAnswer":{"@type":"Answer","text":"Un desarrollador de Shopify freelance puede ser buena opción para un arreglo pequeño y bien definido. Cuando el diseño, el desarrollo, el SEO, la medición y el marketing tienen que funcionar juntos, un equipo de expertos en Shopify mantiene todo coherente y con un responsable claro. Si tu proyecto no necesita una agencia, te lo decimos en la llamada gratis."}},{"@type":"Question","name":"¿Es mejor Shopify o WordPress para mi negocio?","acceptedAnswer":{"@type":"Answer","text":"Si vendes productos en línea, normalmente te conviene Shopify: es confiable, seguro, fácil de administrar y tiene una gran cantidad de apps. WordPress con WooCommerce también puede funcionar, pero te toca encargarte de más cosas técnicas, como el hosting, las actualizaciones y la seguridad. Si tienes un negocio de servicios que sobre todo necesita llamadas, cotizaciones o citas, una página web normal suele ser mejor opción, y para eso está nuestro servicio de diseño de páginas web."}},{"@type":"Question","name":"¿Pueden migrar mi tienda de WooCommerce, Wix u otra plataforma a Shopify?","acceptedAnswer":{"@type":"Answer","text":"Sí. Rediseñamos tiendas Shopify que ya existen y migramos tiendas desde otras plataformas: pasamos tus productos y tu contenido, y configuramos redirecciones para cuidar las visitas que ya te llegan desde Google."}},{"@type":"Question","name":"¿Mi tienda Shopify va a estar optimizada para Google?","acceptedAnswer":{"@type":"Answer","text":"Sí. Cada tienda que hacemos incluye las bases de SEO técnico: carga rápida, diseño adaptado al celular, URLs limpias, títulos y descripciones correctos, texto alternativo en las imágenes, mapa del sitio y datos estructurados de producto. Eso le da a Google una idea clara de tu tienda; las posiciones después dependen de tu contenido, tu competencia y el tiempo."}},{"@type":"Question","name":"¿Puedo tener mi tienda Shopify en inglés y en español?","acceptedAnswer":{"@type":"Answer","text":"Sí. Shopify permite vender en varios idiomas, así que tu tienda puede tener una versión en inglés y otra en español para que cada cliente compre en el idioma que prefiere. Nosotros la configuramos, te acompañamos en español durante todo el proyecto, y puedes usar el panel de administración de Shopify en español."}}]}</script>
