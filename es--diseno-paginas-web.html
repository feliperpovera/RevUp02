    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Cuánto cuesta una página web para un negocio en Estados Unidos?","acceptedAnswer":{"@type":"Answer","text":"Depende del alcance: cuántas páginas necesitas, cuántos servicios y zonas quieres cubrir, si necesitas citas en línea o integración con tu CRM, si el sitio va en uno o dos idiomas y si nosotros escribimos los textos. El diseño web se cotiza por proyecto. Después de una llamada gratis te mandamos una cotización por escrito, para que sepas el precio completo antes de empezar. Si además quieres que manejemos anuncios o SEO, esos son planes mensuales aparte que están en nuestra página de precios."}},{"@type":"Question","name":"¿Hacen páginas web para contratistas y servicios para el hogar?","acceptedAnswer":{"@type":"Answer","text":"Sí. Las páginas web para contratistas y negocios de servicios para el hogar son el centro de lo que hacemos. Hacemos sitios para contratistas generales, constructoras, plomeros, electricistas, empresas de aire acondicionado, techos, jardinería y limpieza, con páginas de servicios, páginas por zona, botón para llamar y formularios de cotización pensados para conseguir clientes."}},{"@type":"Question","name":"¿Qué debe tener una página web para mi negocio?","acceptedAnswer":{"@type":"Answer","text":"Como mínimo: un título que diga qué haces y dónde, una página para cada servicio, tu zona de servicio, reseñas y fotos de trabajos reales, una forma fácil de llamar o pedir cotización en cada página, y que cargue rápido en el celular. Esa es la estructura con la que empezamos cada proyecto, ajustada a tu negocio."}},{"@type":"Question","name":"¿Mi página web puede estar en inglés y en español?","acceptedAnswer":{"@type":"Answer","text":"Sí. Si atiendes a clientes que hablan inglés y a otros que prefieren español, podemos hacer tu sitio en los dos idiomas, con una versión para cada uno y configurado para que Google entienda qué versión corresponde a cada idioma. Y toda la comunicación contigo durante el proyecto es en español."}},{"@type":"Question","name":"¿Cómo elijo una buena agencia de diseño web para mi negocio?","acceptedAnswer":{"@type":"Answer","text":"Busca una agencia de diseño web que entienda cómo compran tus clientes. Pregunta cómo manejan la velocidad en el celular, las llamadas y los formularios, las bases de SEO y la medición, no solo cómo se ve el sitio, y si te pueden ayudar a traer visitas después del lanzamiento. Con gusto te explicamos todo eso en una llamada gratis."}},{"@type":"Question","name":"¿Pueden rediseñar mi página web actual?","acceptedAnswer":{"@type":"Answer","text":"Sí. Hacemos el rediseño de tu página web, pasamos tu contenido al sitio nuevo y cuidamos el valor de SEO que ya tienes, con redirecciones para no perder las visitas que hoy te llegan desde Google."}},{"@type":"Question","name":"¿Mi nueva página web va a aparecer en Google?","acceptedAnswer":{"@type":"Answer","text":"Cada sitio incluye las bases de SEO: carga rápida, diseño adaptado al celular, títulos y descripciones correctos, mapa del sitio, datos estructurados y Google Search Console configurado. Aun así, nadie puede garantizarte una posición: aparecer más arriba depende de tu competencia y de un trabajo constante, y en eso te podemos ayudar con nuestro servicio de SEO local."}},{"@type":"Question","name":"¿También hacen tiendas en línea y anuncios?","acceptedAnswer":{"@type":"Answer","text":"Sí. Para negocios que venden productos hacemos tiendas en Shopify; mira nuestro servicio de Agencia Shopify. Y como manejamos Google Ads, Meta Ads y TikTok Ads, podemos planear tu página y tus campañas juntas, con cada página lista para medir los contactos que llegan."}}]}</script>
