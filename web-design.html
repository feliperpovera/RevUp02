    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How much does website design cost for a small business?","acceptedAnswer":{"@type":"Answer","text":"It depends on scope: how many pages you need, how many services and service areas you want covered, whether you need booking or CRM integrations, and whether we write the copy. Website design is quoted per project. After a free call we send you a written quote, so you know the full price before any work starts. If you also want us to manage ads or SEO, those are separate monthly plans listed on our pricing page."}},{"@type":"Question","name":"Do you build websites for contractors and home service businesses?","acceptedAnswer":{"@type":"Answer","text":"Yes. Contractor website design and web design for home services are at the core of what we do. We build websites for general contractors, construction companies, plumbers, electricians, HVAC, roofing, landscaping and cleaning companies, with service pages, service-area pages, click-to-call and quote forms designed to generate leads."}},{"@type":"Question","name":"What should a small business website include?","acceptedAnswer":{"@type":"Answer","text":"At minimum: a headline that says what you do and where, a page for each service, your service area, reviews and photos of real work, an easy way to call or request a quote on every page, and fast load times on mobile. That's the structure we start from on every project, adjusted to your business."}},{"@type":"Question","name":"How do I choose the best website design company for my small business?","acceptedAnswer":{"@type":"Answer","text":"Look for a web design agency for small businesses that understands how your customers buy. Ask how they handle mobile speed, calls and quote forms, SEO basics and tracking, not just how the site looks, and whether they can help you bring traffic after launch. We're happy to walk you through all of that on a free call."}},{"@type":"Question","name":"Can you redesign my current website?","acceptedAnswer":{"@type":"Answer","text":"Yes. We can redesign your existing site and move your content while protecting the SEO value you already have."}},{"@type":"Question","name":"Will my new website show up on Google?","acceptedAnswer":{"@type":"Answer","text":"Every site includes SEO foundations: fast load times, mobile-friendly design, proper titles and descriptions, a sitemap, structured data and Google Search Console setup. Ranking also depends on competition and ongoing work, which we can help with through our local SEO services."}},{"@type":"Question","name":"Do you also build online stores?","acceptedAnswer":{"@type":"Answer","text":"Yes. For product businesses we build Shopify stores. See our Shopify development service."}},{"@type":"Question","name":"Can you run ads to my new website?","acceptedAnswer":{"@type":"Answer","text":"Yes. We run Google Ads, Meta Ads and TikTok Ads, so your website and campaigns are planned together and every page is ready to track leads."}}]}</script>
