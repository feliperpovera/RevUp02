    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"¿Cuánto cuesta anunciarse en Google Ads?","acceptedAnswer":{"@type":"Answer","text":"Tiene dos partes. La primera es tu presupuesto de anuncios, que tú decides y pagas directamente a Google; en la mayoría de las campañas de búsqueda pagas por clic, y el costo varía según tu industria y tu ciudad. La segunda es nuestra tarifa mensual fija de administración. Los precios están en los planes de esta página; si eliges el Paquete Búsqueda o Crecimiento Total, se suma un arranque SEO de pago único."}},{"@type":"Question","name":"¿Cómo funciona la publicidad en Google?","acceptedAnswer":{"@type":"Answer","text":"Eliges las búsquedas en las que quieres aparecer, por ejemplo \"reparación de aire acondicionado\", y Google muestra tu anuncio a las personas de tu zona que buscan eso. En las campañas de búsqueda pagas cuando alguien hace clic; en Local Services pagas por cada contacto. Google decide qué anuncio sale primero según la oferta y la calidad del anuncio y de tu página, por eso la configuración importa tanto como el presupuesto."}},{"@type":"Question","name":"¿Mis anuncios pueden aparecer en Google Maps?","acceptedAnswer":{"@type":"Answer","text":"Sí. Cuando conectamos tu Perfil de Empresa de Google a tu cuenta de Google Ads, tus anuncios pueden mostrarse en Google Maps a personas que buscan tu servicio cerca de donde trabajas. No es una campaña aparte con otro precio: forma parte de tu presupuesto de Google Ads."}},{"@type":"Question","name":"¿Qué es mejor: anuncios en Google o en Meta?","acceptedAnswer":{"@type":"Answer","text":"Depende de tu negocio. Los anuncios en Google llegan a personas que ya están buscando tu servicio, por eso suelen funcionar muy bien para negocios de servicios. Meta (Facebook e Instagram) sirve para darte a conocer y volver a impactar a quien ya te vio. Muchos negocios empiezan con Google y suman Meta después; el plan Crecimiento Total incluye ambas plataformas."}},{"@type":"Question","name":"¿Cómo invertir en publicidad en Google si mi negocio es pequeño?","acceptedAnswer":{"@type":"Answer","text":"No necesitas un presupuesto grande. Empieza con tu servicio más rentable y tu zona principal, mide cada llamada y formulario, y aumenta la inversión solo en lo que trae clientes. Lo importante es que la campaña esté bien configurada desde el inicio para no desperdiciar dinero."}},{"@type":"Question","name":"¿Por qué contratar una agencia de Google Ads en vez de hacerlo yo mismo?","acceptedAnswer":{"@type":"Answer","text":"Google Ads es fácil de encender y fácil de desperdiciar. Un experto en Google Ads revisa cada semana en qué búsquedas se va tu dinero, elimina las que no traen clientes y mide las llamadas reales, mientras tú te enfocas en atender tu negocio. Y con nosotros todo es en español."}},{"@type":"Question","name":"¿Trabajan con negocios hispanos en todo Estados Unidos?","acceptedAnswer":{"@type":"Answer","text":"Sí. Somos una agencia de marketing digital en español que trabaja con negocios en todo Estados Unidos, con atención en español de principio a fin y anuncios en inglés y en español según cómo buscan tus clientes. Trabajamos contigo por llamada, videollamada y WhatsApp, estés donde estés."}},{"@type":"Question","name":"¿La cuenta de Google Ads es mía?","acceptedAnswer":{"@type":"Answer","text":"Sí. Tu cuenta, tus datos y tus anuncios siempre te pertenecen. Trabajamos dentro de tu cuenta con acceso de administrador, y si algún día decides irte, todo se queda contigo."}}]}</script>
